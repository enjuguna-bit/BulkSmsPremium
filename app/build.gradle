// â”€â”€ Build-time secrets helper â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// Priority (highest to lowest):
//   1. Environment variable  (CI / CD pipelines)
//   2. ~/.gradle/gradle.properties  (local dev machine, never committed)
//   3. local.properties in project root  (developer override, gitignored)
//
// To set locally, add to ~/.gradle/gradle.properties:
//   BILLING_BASE_URL=https://your-worker.workers.dev
//   WEBHOOK_SECRET=your-secret
//
// The release build will FAIL if BILLING_BASE_URL is not set, preventing
// accidental production deployments with wrong credentials.

def getBillingBaseUrl() {
    // 1. CI environment variable
    def envUrl = System.getenv('BILLING_BASE_URL')
    if (envUrl) return envUrl
    // 2. Gradle properties (local dev)
    if (project.hasProperty('BILLING_BASE_URL')) return project.property('BILLING_BASE_URL')
    // 3. local.properties
    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) {
        localProps.load(localFile.newDataInputStream())
        def localUrl = localProps.getProperty('BILLING_BASE_URL')
        if (localUrl) return localUrl
    }
    return null
}

def getWebhookSecret() {
    def envVal = System.getenv('WEBHOOK_SECRET')
    if (envVal) return envVal
    if (project.hasProperty('WEBHOOK_SECRET')) return project.property('WEBHOOK_SECRET')
    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) {
        localProps.load(localFile.newDataInputStream())
        def localVal = localProps.getProperty('WEBHOOK_SECRET')
        if (localVal) return localVal
    }
    return null
}

android {
    namespace 'com.afriserve.smsmanager'
    compileSdk 35

    defaultConfig {
        applicationId "com.afriserve.smsmanager"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        // BILLING_BASE_URL â€” must be provided via env / gradle.properties / local.properties.
        // Release builds abort if missing; debug builds fall back to localhost for safety.
        def billingUrl = getBillingBaseUrl()
        if (billingUrl == null) {
            if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
                throw new GradleException(
                    "BILLING_BASE_URL is not set. " +
                    "Add it to ~/.gradle/gradle.properties or set the environment variable. " +
                    "Never hard-code the production URL in build.gradle."
                )
            }
            billingUrl = 'http://localhost:8787'
            logger.warn("WARNING: BILLING_BASE_URL not set â€” using localhost fallback for debug build.")
        }
        buildConfigField "String", "BILLING_BASE_URL", "\"${billingUrl}\""

        // WEBHOOK_SECRET â€” must be non-empty for release builds.
        def webhookSecret = getWebhookSecret()
        if ((webhookSecret == null || webhookSecret.isEmpty()) &&
                gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }) {
            throw new GradleException(
                "WEBHOOK_SECRET is not set. " +
                "Add it to ~/.gradle/gradle.properties or set the environment variable."
            )
        }
        buildConfigField "String", "WEBHOOK_SECRET", "\"${webhookSecret ?: ''}\""
    }

    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
            zipAlignEnabled true
            crunchPngs = true
        }
        debug {
            minifyEnabled false
            debuggable true
            versionNameSuffix "-DEBUG"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    buildFeatures {
        viewBinding true
        dataBinding false
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/INDEX.LIST'
            ]
        }
    }

    splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

kotlin {
    jvmToolchain(17)
}

kapt {
    correctErrorTypes = true
    mapDiagnosticLocations = true
    useBuildCache = true
    includeCompileClasspath = false
    arguments {
        arg("dagger.fastInit", "disabled")
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }
}

